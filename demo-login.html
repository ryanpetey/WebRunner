<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northstar Workspace</title><style>body{margin:0;font:16px/1.5 system-ui;background:linear-gradient(135deg,#eef2ff,#f8fafc 55%,#f5f3ff);color:#1f2430}.wrap{min-height:100vh;display:grid;place-items:center;padding:32px}.card{width:min(460px,100%);background:#fff;border:1px solid #dde2ec;border-radius:18px;box-shadow:0 18px 50px rgba(16,24,40,.10);padding:32px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:800;display:grid;place-items:center;font-size:21px}.brand strong{display:block;font-size:17px}.muted{color:#667085}.field{margin-top:18px}label{display:block;font-weight:650;margin-bottom:7px}input{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #cfd6e4;border-radius:10px;font:inherit;background:#fff}input:focus{outline:2px solid #c7d2fe;border-color:#6366f1}button{margin-top:22px;width:100%;padding:12px 16px;border:0;border-radius:10px;background:#4f46e5;color:#fff;font:700 16px system-ui;cursor:pointer}.foot{margin-top:18px;color:#667085;font-size:13px;text-align:center}.success{display:none;margin-top:18px;padding:12px 14px;border-radius:10px;background:#ecfdf3;border:1px solid #abefc6;color:#067647;font-weight:650}</style></head><body><div class="wrap"><main class="card"><div class="brand"><div class="mark">N</div><div><strong>Northstar Workspace</strong><div class="muted">Team portal</div></div></div><h1 style="font-size:28px;margin:0 0 8px">Welcome back</h1><p class="muted" style="margin:0">Sign in to continue to your workspace.</p><form id="demoForm"><div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" value="demo.user"></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" value="webrunner-demo"></div><button id="loginBtn" type="submit">Sign in</button></form><div id="success" class="success">Signed in successfully.</div><div class="foot">Public demonstration page · Sample credentials only · Nothing is transmitted</div></main></div><script>document.getElementById('demoForm').addEventListener('submit',e=>{e.preventDefault();document.getElementById('success').style.display='block';});</script></body></html>
